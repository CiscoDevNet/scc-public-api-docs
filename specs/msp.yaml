info:
  description: MSP APIs for viewing, creating and updating the manager and managed organizations
  title: MSP APIs
  version: 1.4.0
openapi: 3.0.3
paths:
  /enterprises/{id}/addManaged:
    post:
      description: Establishes management relationships between the specified manager organization and one or more existing organizations. All organizations must exist before creating relationships.
      operationId: addEnterpriseManagementRelationship
      parameters:
        - description: manager enterprise id. This API works only for the manager enterprise
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntitlementShareRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  managedOrgs:
                    items:
                      $ref: '#/components/schemas/PostManagedRelationshipResponse'
                    type: array
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized - User is not an admin of the associated enterprise
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden - User is not an admin of the associated enterprise
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal Server Error
      security:
        - bearerAuth: []
      summary: Add management relationships to existing organizations
      tags:
        - Management Relationships
      x-publicly-available: true
  /enterprises/{id}/createManaged:
    post:
      description: Creates a new organization and establishes it as managed by the specified manager organization. This forms a management relationship between the two organizations.
      operationId: createEnterpriseManagementRelationship
      parameters:
        - description: manager enterprise id. This API works only for the manager enterprise
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                country:
                  properties:
                    label:
                      type: string
                    value:
                      type: string
                  type: object
                displayName:
                  type: string
                name:
                  type: string
                region:
                  properties:
                    label:
                      type: string
                    value:
                      type: string
                  type: object
              required:
                - name
                - displayName
                - region
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  managedOrgs:
                    items:
                      $ref: '#/components/schemas/PostManagedRelationshipResponse'
                    type: array
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized - User is not an admin of the associated enterprise
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden - User is not an admin of the associated enterprise
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal Server Error
      security:
        - bearerAuth: []
      summary: Create a new managed organization
      tags:
        - Management Relationships
      x-publicly-available: true
  /enterprises/{id}/managed:
    get:
      operationId: getEnterpriseManagementRelationshipManaged
      parameters:
        - content:
            application/json:
              schema:
                type: string
          description: ID of the manager org or the managed org
          in: path
          name: id
          required: true
        - content:
            application/json:
              schema:
                type: string
          description: offset to paginated results
          in: query
          name: page
          required: false
        - content:
            application/json:
              schema:
                type: string
          description: to limit the management relationship array response
          in: query
          name: limit
          required: false
        - content:
            application/json:
              schema:
                type: string
          description: |
            filter or search on fields such as organizations or subscriptions.
            For example, `filter="oyo"` will return all organizations where Enterprise name like "Toyota", as well as subscription IDs like "subs_oyo123" and product names like  "prod_oyo123".
          in: query
          name: filter
          required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  limit:
                    example: 10
                    type: integer
                  organizations:
                    items:
                      $ref: '#/components/schemas/organizationsRelationship'
                    type: array
                  page:
                    example: 1
                    type: integer
                  relationshipType:
                    example: managed
                    type: string
                  totalItems:
                    example: 100
                    type: integer
          description: ok
        '404':
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/GeneralError'
      security:
        - bearerAuth: []
      summary: Get all management relationship for the manager organization
      tags:
        - Management Relationships
      x-publicly-available: true
  /enterprises/{id}/manager:
    get:
      operationId: getEnterpriseManagementRelationshipManager
      parameters:
        - content:
            application/json:
              schema:
                type: string
          description: ID of the manager org or the managed org
          in: path
          name: id
          required: true
        - content:
            application/json:
              schema:
                type: string
          description: offset to paginated results
          in: query
          name: page
          required: false
        - content:
            application/json:
              schema:
                type: string
          description: to limit the management relationship array response
          in: query
          name: limit
          required: false
        - content:
            application/json:
              schema:
                type: string
          description: |
            filter or search on fields such as organizations or subscriptions.
            For example, `filter="cdk"` will return all organizations where Enterprise name like "cdkLimited", as well as subscription IDs like "subs_cdk123" and product names like  "prod_cdk123".
          in: query
          name: filter
          required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  limit:
                    example: 10
                    type: integer
                  organizations:
                    items:
                      $ref: '#/components/schemas/organizationsRelationship'
                    type: array
                  page:
                    example: 1
                    type: integer
                  relationshipType:
                    example: manager
                    type: string
                  totalItems:
                    example: 100
                    type: integer
          description: ok
        '404':
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/GeneralError'
      security:
        - bearerAuth: []
      summary: Get all management relationships of managed organization
      tags:
        - Management Relationships
      x-publicly-available: true
  /enterprises/{managedId}/manager/{managerId}:
    get:
      operationId: getEnterpriseManagementRelationshipManagerDetails
      parameters:
        - description: ID of the manager org
          in: path
          name: managerId
          required: true
          schema:
            type: string
        - description: ID of the managed org
          in: path
          name: managedId
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  organizations:
                    items:
                      $ref: '#/components/schemas/organizationsRelationship'
                    type: array
                  relationshipType:
                    example: manager
                    type: string
          description: ok
        '404':
          $ref: '#/components/responses/NotFoundError'
        default:
