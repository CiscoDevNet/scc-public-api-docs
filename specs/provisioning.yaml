components:
  schemas:
    gorm.DeletedAt:
      properties:
        time:
          type: string
        valid:
          description: Valid is true if Time is not NULL
          type: boolean
      type: object
    model.AcceptLegacyProductInvitationRequest:
      properties:
        enterpriseId:
          type: string
      type: object
    model.ActivationStatus:
      properties:
        activationStatus:
          $ref: '#/components/schemas/model.ProvisioningStatus'
        activationTime:
          type: string
        isActive:
          type: boolean
        productInstanceId:
          type: string
        productName:
          type: string
        tenantId:
          type: string
      type: object
    model.AddManagedEntitlementsRequest:
      properties:
        initialAdmin:
          type: string
        managedOrgs:
          items:
            $ref: '#/components/schemas/model.Organization'
          type: array
      type: object
    model.AddManagedEntitlementsResponse:
      properties:
        failed:
          items:
            $ref: '#/components/schemas/model.AddManagedEntitlementsResult'
          type: array
        success:
          items:
            $ref: '#/components/schemas/model.AddManagedEntitlementsResult'
          type: array
      type: object
    model.AddManagedEntitlementsResult:
      properties:
        errors:
          items:
            type: string
          type: array
        managedOrgId:
          type: string
      type: object
    model.AdditionalTenantMetadata:
      properties:
        key:
          type: string
        value:
          type: string
      type: object
    model.AppError:
      properties:
        code:
          type: integer
        error: {}
        errorCode:
          type: integer
        message:
          type: string
      type: object
    model.AttachCDOTenantRequest:
      properties:
        cdoTenantId:
          type: string
      required:
        - cdoTenantId
      type: object
    model.Body:
      properties:
        activation_code:
          type: string
        id:
          type: string
        meta:
          $ref: '#/components/schemas/model.Meta'
      type: object
    model.ClaimCodeProduct:
      properties:
        id:
          type: string
        is_use_existing_tenant_set:
          type: boolean
        name:
          type: string
        region:
          $ref: '#/components/schemas/model.Region'
      required:
        - id
        - region
      type: object
    model.ClaimCodeReadRequest:
      properties:
        claim_code:
          type: string
        enterprise_id:
          type: string
      type: object
    model.ClaimCodeServices:
      properties:
        id:
          type: string
        is_use_existing_tenant_set:
          type: boolean
        name:
          type: string
      required:
        - id
      type: object
    model.ClaimStatus:
      properties:
        claimCode:
          type: string
        claimedAt:
          type: string
        claimedByEmail:
          type: string
        enterpriseId:
          type: string
        enterpriseName:
          type: string
        isClaimable:
          type: boolean
        isClaimed:
          type: boolean
      type: object
    model.ClaimSubscription:
      properties:
        claim_code:
          type: string
        enterprise_id:
          type: string
        enterprise_name:
          type: string
        enterprise_type:
          type: string
        products:
          items:
            $ref: '#/components/schemas/model.ClaimCodeProduct'
          type: array
        services:
          items:
            $ref: '#/components/schemas/model.ClaimCodeServices'
          type: array
      type: object
    model.ClaimedEntitlement:
      description: ClaimedEntitlement represents a single claimed subscription with its SKUs
      properties:
        endDate:
          type: string
        externalSubscriptionId:
          type: string
        isTrial:
          type: boolean
        licenseType:
          type: string
        skus:
          additionalProperties:
            $ref: '#/components/schemas/model.ClaimedEntitlementsSKU'
          type: object
      type: object
    model.ClaimedEntitlementsSKU:
      description: ClaimedEntitlementsSKU represents SKU details in claimed entitlements
      properties:
        entitlements:
          type: integer
        productsList:
          items:
            $ref: '#/components/schemas/model.ProductConfManagedOrg'
          type: array
        skuName:
          type: string
      type: object
    model.ClaimedSubscriptions:
      description: ClaimedSubscriptions represents the response structure for claimed entitlements
      properties:
        claimedSubscriptions:
          items:
            $ref: '#/components/schemas/model.ClaimedEntitlement'
          type: array
        pagination:
          $ref: '#/components/schemas/model.PaginationInfo'
      type: object
    model.Contact:
      properties:
        contactType:
          type: string
        emailId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
      type: object
    model.Enterprise:
      properties:
        enterpriseId:
          type: string
        enterpriseName:
          type: string
      type: object
    model.EnterpriseDetails:
      properties:
        enterpriseId:
          type: string
      type: object
    model.EnterpriseProductInstances:
      properties:
        enterpriseName:
          type: string
        isLicensed:
          type: boolean
        productInstancesInfo:
          items:
            $ref: '#/components/schemas/model.MergedProductInstancesInfo'
          type: array
      type: object
    model.Entitlement:
      properties:
        description:
          type: string
        isService:
          type: boolean
        name:
          type: string
        productType:
          type: string
        value:
          type: string
      type: object
    model.EntitlementDetails:
      properties:
        managedOrgIds:
          items:
            type: string
          type: array
        managerOrgIds:
          items:
            type: string
          type: array
        operationType:
          type: string
        pagination:
          $ref: '#/components/schemas/model.PaginationDetails'
        search:
          type: string
      required:
        - operationType
        - pagination
      type: object
    model.EntitlementInstance:
      properties:
        Deleted:
          $ref: '#/components/schemas/gorm.DeletedAt'
        createdAt:
          type: string
        entitlement:
          $ref: '#/components/schemas/model.Entitlement'
        id:
          description: |-
            Let PostgreSQL auto-generate UUIDs using gen_random_uuid()
            This avoids setting ID manually in code and ensures consistency when using DBResolver.
            Previously, missing default caused nil UUID errors with replicas in DBResolver setup.
          type: string
        isAddOn:
          type: boolean
        is_trial:
          type: boolean
        provisionCheck:
          allOf:
            - $ref: '#/components/schemas/model.ProvisionCheck'
          description: Field for single tenancy check while claiming
        quantity:
          type: integer
        subscription:
          $ref: '#/components/schemas/model.Subscription'
        trial:
          $ref: '#/components/schemas/model.Trial'
        updatedAt:
          type: string
      type: object
    model.EntitlementInstanceMinimalInfo:
      properties:
        product_key:
          type: string
        product_name:
          type: string
        subscription_end_date:
          type: string
        subscription_id:
          type: string
        subscription_start_date:
          type: string
        trial_end_date:
          type: string
        trial_id:
          type: string
        trial_start_date:
          type: string
      type: object
    model.Error:
      properties:
        error:
          type: string
        message:
          type: string
      type: object
    model.FollowOn:
      properties:
        followOnDetails:
          items:
            $ref: '#/components/schemas/model.FollowOnDetails'
          type: array
        followOnSubRefId:
          type: string
      type: object
    model.FollowOnDetails:
      properties:
        cancelEligSubRefId:
          type: string
      type: object
    model.Health:
      properties:
        currentTime:
          type: string
        healthStatus:
          type: string
        serviceName:
          type: string
        serviceStatus:
          type: string
      type: object
    model.InvitationStatus:
      enum:
        - invitation_pending
        - invitation_rejected
        - invitation_accepted
        - invitation_fulfilled
      type: string
      x-enum-varnames:
        - InvitationStatusPending
        - InvitationStatusRejected
        - InvitationStatusAccepted
        - InvitationStatusFulfilled
    model.LegacyProductInvite:
      properties:
        email:
          type: string
        invitationId:
          type: string
        productExternalTenantId:
          type: string
        productName:
          type: string
        region:
          type: string
        status:
          $ref: '#/components/schemas/model.InvitationStatus'
      type: object
    model.LegacyProductInviteRequest:
      properties:
        productExternalTenantId:
          type: string
        region:
          type: string
        users:
          items:
            type: string
          type: array
      type: object
    model.MajorLine:
      properties:
        action:
          minLength: 1
          type: string
        offerType:
          type: string
        partyAccounts:
          items:
            $ref: '#/components/schemas/model.PartyAccount'
          type: array
        provInfoEmail:
          type: string
        requestedStartDate:
          minLength: 1
          type: string
      required:
        - action
        - requestedStartDate
      type: object
    model.ManagedOrg:
      properties:
        id:
          type: string
        name:
          type: string
        products:
          items:
            $ref: '#/components/schemas/model.ManagedOrgProductsList'
          type: array
      type: object
    model.ManagedOrgProductsList:
      properties:
        name:
          type: string
        quantity:
          type: integer
      type: object
    model.ManagerOrgDetails:
      properties:
        id:
          type: string
        subscriptions:
          items:
            $ref: '#/components/schemas/model.SubscriptionInfo'
          type: array
      type: object
    model.ManagerOrgsInfo:
      properties:
        itemsPerPage:
          type: integer
        organizationSubscriptions:
          items:
            $ref: '#/components/schemas/model.ManagerOrgDetails'
          type: array
        startIndex:
          type: integer
        totalResults:
          type: integer
      type: object
    model.MergedProductInstancesInfo:
      properties:
        additionalTenantMetadata:
          items:
            $ref: '#/components/schemas/model.AdditionalTenantMetadata'
          type: array
        entitlements:
          items: {}
          type: array
        externalTenantId:
          type: string
        id:
          type: string
        isOrgEntitled:
          type: boolean
        isPlatformProduct:
          description: cleanup this once discoveryAPIEnhancement flag is enabled
          type: boolean
        productName:
          type: string
        productType:
          type: string
        provisioningStatus:
          type: string
        region:
          $ref: '#/components/schemas/model.Region'
      type: object
    model.Meta:
      properties:
        additionalTenantMetadata:
          items:
            $ref: '#/components/schemas/model.AdditionalTenantMetadata'
          type: array
        created:
          $ref: '#/components/schemas/model.XSDSupportingDateTime'
        lastModified:
          $ref: '#/components/schemas/model.XSDSupportingDateTime'
        location:
          type: string
        resourceType:
          type: string
      type: object
    model.MigrateTenantRequest:
      properties:
        additionalParams:
          additionalProperties:
            type: string
          type: object
        adminEmail:
          type: string
        managedTenants:
          items:
            type: string
          type: array
        productKey:
          type: string
        region:
          type: string
        runId:
          type: string
        tenantId:
          type: string
        tenantName:
          type: string
      required:
        - adminEmail
        - productKey
        - region
        - runId
        - tenantId
      type: object
    model.MinorLine:
      properties:
        actionType:
          minLength: 1
          type: string
        partName:
          minLength: 1
          type: string
        quantity:
          minLength: 1
          type: string
      required:
        - actionType
        - partName
        - quantity
      type: object
    model.MoveSubscriptionRequest:
      properties:
        adminEmail:
          type: string
        isSubscription:
          type: boolean
        sourceEnterpriseId:
          type: string
        subTrialId:
          type: string
        targetEnterpriseId:
          type: string
      required:
        - adminEmail
        - sourceEnterpriseId
        - subTrialId
        - targetEnterpriseId
      type: object
    model.MspRevokedManagedOrgsInfo:
      properties:
        managedOrgs:
          items:
            $ref: '#/components/schemas/model.ManagedOrg'
          type: array
      type: object
    model.MspSku:
      properties:
        availableEntitlements:
          type: integer
        minEntitlementsQuantity:
          type: integer
        productsList:
          items:
            $ref: '#/components/schemas/model.ProductConf'
          type: array
        reservedEntitlements:
          type: integer
        sharedEntitlements:
          items:
            $ref: '#/components/schemas/model.SharedEntitlement'
          type: array
        skuName:
          type: string
      type: object
    model.Option:
      properties:
        description:
          description: Description is the human-readable description of this option
          type: string
        display_text:
          allOf:
            - $ref: '#/components/schemas/model.ProductText'
          description: Text linked to selected Option
        value:
          description: Value is the machine-readable option that gets passed downstream
          type: string
      type: object
    model.OrderHeader:
      properties:
        dealId:
          type: string
        orderId:
          type: string
        webOrderId:
          type: string
      type: object
    model.OrderLine:
      properties:
        majorLine:
          $ref: '#/components/schemas/model.MajorLine'
        minorLines:
          items:
            $ref: '#/components/schemas/model.MinorLine'
          minItems: 1
          type: array
      required:
        - minorLines
      type: object
    model.OrderPayload:
      properties:
        callbackUrl:
          minLength: 1
          type: string
        cancelType:
          type: string
        orderAction:
          type: string
        orderRequest:
          $ref: '#/components/schemas/model.OrderRequest'
        orderSource:
          type: string
        serviceEffectiveDate:
          type: string
        serviceProvisioningId:
          minLength: 1
          type: string
        subscriptionPrimaryId:
          minLength: 1
          type: string
      required:
        - callbackUrl
        - orderRequest
        - serviceProvisioningId
        - subscriptionPrimaryId
      type: object
    model.OrderRequest:
      properties:
        followOn:
          items:
            $ref: '#/components/schemas/model.FollowOn'
          type: array
        orderHeader:
          $ref: '#/components/schemas/model.OrderHeader'
        orderLines:
          items:
            $ref: '#/components/schemas/model.OrderLine'
          maxItems: 1
          minItems: 1
          type: array
        provisioningRequest:
          $ref: '#/components/schemas/model.SbpProvisioningRequest'
        sender:
          $ref: '#/components/schemas/model.SbpSender'
        upgrade:
          items:
            $ref: '#/components/schemas/model.OrderRequestUpgrade'
          type: array
      required:
        - orderHeader
        - orderLines
      type: object
    model.OrderRequestUpgrade:
      properties:
        subRefId:
          type: string
        upgradeDetails:
          items:
            $ref: '#/components/schemas/model.UpgradeDetail'
          type: array
        webOrderId:
          type: string
      type: object
    model.OrgEntitlement:
      properties:
        access_type:
          type: string
        description:
          type: string
        is_service:
          type: boolean
        name:
          type: string
        productType:
          type: string
        value:
          type: string
      type: object
    model.OrgEntitlementInstance:
      properties:
        Deleted:
          $ref: '#/components/schemas/gorm.DeletedAt'
        createdAt:
          type: string
        entitlement:
          $ref: '#/components/schemas/model.OrgEntitlement'
        id:
          description: |-
            Let PostgreSQL auto-generate UUIDs using gen_random_uuid()
            This avoids setting ID manually in code and ensures consistency when using DBResolver.
            Previously, missing default caused nil UUID errors with replicas in DBResolver setup.
          type: string
        is_trial:
          type: boolean
        quantity:
          type: integer
        subscription:
          $ref: '#/components/schemas/model.Subscription'
        trial:
          $ref: '#/components/schemas/model.Trial'
        updatedAt:
          type: string
      type: object
    model.OrgEntitlements:
      properties:
        pagination:
          $ref: '#/components/schemas/model.PaginationInfo'
        subscriptions:
          items:
            $ref: '#/components/schemas/model.SubnSku'
          type: array
      type: object
    model.Organization:
      properties:
        id:
          type: string
      type: object
    model.PaginationDetails:
      properties:
        max:
          type: integer
        page:
          type: integer
      type: object
    model.PaginationInfo:
      properties:
        limit:
          type: integer
        offset:
          type: integer
        totalRecords:
          type: integer
      type: object
    model.PartyAccount:
      properties:
        businessName:
          type: string
        contacts:
          items:
            $ref: '#/components/schemas/model.Contact'
          type: array
        name:
          type: string
        siteUseId:
          type: integer
        type:
          type: string
      type: object
    model.PatchUpdateSubscription:
      properties:
        endDate:
          type: string
        sendClaimCodeTo:
          type: string
        skus:
          items:
            $ref: '#/components/schemas/model.SubscriptionSkusInfo'
          type: array
        startDate:
          type: string
      type: object
    model.PostCreateSubscription:
      properties:
        action:
          enum:
            - create
            - cancel
          type: string
        endDate:
          type: string
        id:
          type: string
        isTrial:
          type: boolean
        metadata:
          items:
            $ref: '#/components/schemas/model.ProvisioningInfo'
          type: array
        sendClaimCodeTo:
          type: string
        skus:
          items:
            $ref: '#/components/schemas/model.SubscriptionSkusInfo'
          type: array
        startDate:
          type: string
      required:
        - id
        - sendClaimCodeTo
        - skus
        - startDate
      type: object
    model.Product:
      properties:
        display_text:
          allOf:
            - $ref: '#/components/schemas/model.ProductText'
          description: It is the default text linked to a product
        is_unified_onboarding_supported:
          type: boolean
        name:
          description: Name is the human readable name of the product.
          type: string
        product_allowed_regions:
          description: AllowedRegions are where this product may be provisioned
          items:
            $ref: '#/components/schemas/model.Region'
          type: array
        provisioning_questions:
          items:
            $ref: '#/components/schemas/model.ProvisioningQuestion'
          type: array
      type: object
    model.ProductConf:
      properties:
        activationStatus:
          type: string
        name:
          type: string
        operand:
          type: integer
        operator:
          type: string
        region:
          type: string
      type: object
    model.ProductConfManagedOrg:
      description: ProductConfManagedOrg represents product configuration for managed organizations
      properties:
        activationStatus:
          type: string
        name:
          type: string
        region:
          type: string
      type: object
    model.ProductDetails:
      properties:
        assignedEntitlements:
          type: integer
        product:
          type: string
        productRegion:
          type: string
      type: object
    model.ProductInfo:
      properties:
        assignedEntitlements:
          type: integer
        product:
          type: string
        productRegion:
          type: string
      type: object
    model.ProductInstance:
      properties:
        activationCode:
          type: string
        createdAt:
          type: string
        entitlement_instances:
          description: EntitlementInstances are the actual entitlement this product instance has
          items:
            $ref: '#/components/schemas/model.EntitlementInstance'
          type: array
        external_tenant_id:
          type: string
        id:
          description: |-
            Let PostgreSQL auto-generate UUIDs using gen_random_uuid()
            This avoids setting ID manually in code and ensures consistency when using DBResolver.
            Previously, missing default caused nil UUID errors with replicas in DBResolver setup.
          type: string
        initialAdmin:
          type: string
        isActive:
          type: boolean
        isEA:
          type: boolean
        isHidden:
          type: boolean
        isLegacy:
          type: boolean
        isOrgEntitled:
          type: boolean
        is_trial:
          type: boolean
        is_use_existing_tenant_set:
          type: boolean
        org_entitlement_instances:
          description: OrgEntitlementInstances which are associated with product instances
          items:
            $ref: '#/components/schemas/model.OrgEntitlementInstance'
          type: array
        product:
          $ref: '#/components/schemas/model.Product'
        provisionCheck:
          $ref: '#/components/schemas/model.ProvisionCheck'
        provisioning_metadata:
          items:
            $ref: '#/components/schemas/model.ProvisioningQuestionAnswer'
          type: array
        provisioning_status:
          $ref: '#/components/schemas/model.ProvisioningStatus'
        region:
          allOf:
            - $ref: '#/components/schemas/model.Region'
          description: Region is where this ProductInstance is (or will be) provisioned
        updatedAt:
          type: string
      type: object
    model.ProductInstanceApplyLicensesRequest:
      properties:
        sourceInstanceId:
          type: string
      type: object
    model.ProductInstanceInfo:
      properties:
        body:
          $ref: '#/components/schemas/model.Body'
        response_code:
          type: integer
      type: object
    model.ProductInstanceProvisionRequest:
      properties:
        additional_metadata:
          items:
            $ref: '#/components/schemas/model.ProvisioningQuestionAnswer'
          type: array
        create_new_tenant:
          type: boolean
        initial_admin:
          type: string
        region:
          type: string
      type: object
    model.ProductInstanceResponseDTO:
      properties:
        createdAt:
          type: string
        entitlement_instances:
          description: EntitlementInstances are the actual entitlement this product instance has
          items:
            $ref: '#/components/schemas/model.EntitlementInstance'
          type: array
        external_tenant_id:
          type: string
        id:
          description: |-
            Let PostgreSQL auto-generate UUIDs using gen_random_uuid()
            This avoids setting ID manually in code and ensures consistency when using DBResolver.
            Previously, missing default caused nil UUID errors with replicas in DBResolver setup.
          type: string
        initialAdmin:
          type: string
        isActive:
          type: boolean
        product:
          $ref: '#/components/schemas/model.Product'
        provisioning_metadata:
          items:
            $ref: '#/components/schemas/model.ProvisioningQuestionAnswer'
          type: array
        provisioning_status:
          $ref: '#/components/schemas/model.ProvisioningStatus'
        region:
          allOf:
            - $ref: '#/components/schemas/model.Region'
          description: Region is where this ProductInstance is (or will be) provisioned
        updatedAt:
          type: string
      type: object
    model.ProductInstanceWithMetadata:
      properties:
        activationCode:
          type: string
        additionalTenantMetadata:
          items:
            $ref: '#/components/schemas/model.AdditionalTenantMetadata'
          type: array
        createdAt:
          type: string
        entitlement_instances:
          description: EntitlementInstances are the actual entitlement this product instance has
          items:
            $ref: '#/components/schemas/model.EntitlementInstance'
          type: array
        external_tenant_id:
          type: string
        id:
          description: |-
            Let PostgreSQL auto-generate UUIDs using gen_random_uuid()
            This avoids setting ID manually in code and ensures consistency when using DBResolver.
            Previously, missing default caused nil UUID errors with replicas in DBResolver setup.
          type: string
        initialAdmin:
          type: string
        isActive:
          type: boolean
        isEA:
          type: boolean
        isHidden:
          type: boolean
        isLegacy:
          type: boolean
        isOrgEntitled:
          type: boolean
        is_trial:
          type: boolean
        is_use_existing_tenant_set:
          type: boolean
        org_entitlement_instances:
          description: OrgEntitlementInstances which are associated with product instances
          items:
            $ref: '#/components/schemas/model.OrgEntitlementInstance'
          type: array
        product:
          $ref: '#/components/schemas/model.Product'
        provisionCheck:
          $ref: '#/components/schemas/model.ProvisionCheck'
        provisioning_metadata:
          items:
            $ref: '#/components/schemas/model.ProvisioningQuestionAnswer'
          type: array
        provisioning_status:
          $ref: '#/components/schemas/model.ProvisioningStatus'
        region:
          allOf:
            - $ref: '#/components/schemas/model.Region'
          description: Region is where this ProductInstance is (or will be) provisioned
        updatedAt:
          type: string
      type: object
    model.ProductInstancesAndRegionsAndServices:
      properties:
        all_regions:
          $ref: '#/components/schemas/model.RegionalHierarchy'
        productInstances:
          items:
            $ref: '#/components/schemas/model.ProductInstance'
          type: array
        services:
          items:
            $ref: '#/components/schemas/model.Services'
          type: array
      type: object
    model.ProductText:
      properties:
        description:
          type: string
        value:
          type: string
