  securitySchemes:
    EnterpriseAdminBearerAuth:
      flows:
        clientCredentials:
          scopes:
            security:enterprise:admin:{enterprise_id}: ' "Grants enterprise admin access with dynamic enterprise ID validation"'
          tokenUrl: https://id.cisco.com/oauth2/default/v1/token
      type: oauth2
    ServiceTokenBearerAuth:
      flows:
        clientCredentials:
          scopes:
            provisioning:subscriptions:write: ' "Grants write access to subscriptions"'
            provisioning:trials:write: ' "Grants write access to trials"'
            security:global:provisioning-config:write: ' "Grants write access to global provisioning configuration"'
            security:global:provisioning-maintenance:write: ' "Grants write access to global provisioning maintenance"'
            security:global:provisioning-status:write: ' "Grants write access to global provisioning status"'
            security:global:provisioning-subscription:write: ' "Grants write access to global provisioning subscriptions"'
            security:global:provisioning:tenants-attach: ' "Grants attach access to global provisioning tenants"'
            security:global:provisioning:tenants-write: ' "Grants write access to global provisioning tenants"'
            security:global:provisioning:tenants:write: ' "Grants write access to global provisioning tenants"'
            security:global:provisioning:trials:read: ' "Grants read access to global provisioning trials"'
            security:provisioning:brownfield-subscriptions:write: ' "Grants write access to brownfield subscriptions"'
            security:provisioning:config:read: ' "Grants read access to provisioning configuration"'
            security:provisioning:config:write: ' "Grants write access to provisioning configuration"'
            security:provisioning:data-sync: ' "Grants access to provisioning data synchronization"'
            security:provisioning:maintenance:write: ' "Grants write access to provisioning maintenance"'
            security:provisioning:metrics:read: ' "Grants read access to provisioning metrics"'
            security:provisioning:smart-licences:write: ' "Grants write access to smart licenses provisioning"'
            security:provisioning:subscriptions:read: ' "Grants read access to provisioning subscriptions"'
            security:provisioning:subscriptions:write: ' "Grants write access to provisioning subscriptions"'
            security:provisioning:tenants:read: ' "Grants read access to provisioning tenants"'
            security:subscription:move: ' "Grants permission to move subscriptions between enterprises"'
            security:{product_id}:provisioning:tenants-attach: ' "Grants product-specific tenant attachment permissions"'
            testing:provisioning:write: ' "Grants write access for testing provisioning operations"'
          tokenUrl: https://id.cisco.com/oauth2/default/v1/token
      type: oauth2
info:
  contact: {}
  description: Provisioning microservice for activating and managing entitlements, subscriptions, and claim codes
  title: Provisioning Microservice API
  version: 1.0.1
openapi: 3.0.0
paths:
  /claim-code/claim:
    post:
      description: Process claim code to provision subscriptions and product instances for an enterprise
      operationId: claim-code-subscription
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/model.ClaimSubscription'
        description: Claim code subscription details for processing
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
          description: Successfully claimed and provisioned product instances
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Bad request - invalid input data, missing enterprise ID, or validation errors
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Unauthorized - invalid or missing authentication token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Forbidden - user is not admin of the enterprise or claim is blocked
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Not found - claim code or enterprise not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Conflict - claim code already used or provisioning conflicts
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Internal server error during provisioning
      security:
        - EnterpriseAdminBearerAuth:
            - security:enterprise:admin:{enterprise_id}
      summary: Claim Code for Subscription
      tags:
        - Claim Code
  /claim-code/read:
    post:
      description: Retrieve product instances associated with a specific claim code for an enterprise
      operationId: get-product-instances-by-claim-code
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/model.ClaimCodeReadRequest'
        description: Claim code read request containing claim_code and enterprise_id
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ProductInstancesAndRegionsAndServices'
          description: Successfully retrieved product instances
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Bad request - invalid input data
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Unauthorized - invalid or missing authentication token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Forbidden - user is not admin of the enterprise
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Not found - claim code or enterprise not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Internal server error
      security:
        - EnterpriseAdminBearerAuth:
            - security:enterprise:admin:{enterprise_id}
      summary: Get Product Instances by Claim Code
      tags:
        - Claim Code
  /customers:
    get:
      description: Get all active Product Instance for a customer by Enterprise Id
      operationId: GetCustomerProductInstances
      parameters:
        - description: Enterprise Id
          in: query
          name: enterprise_id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ProductInstanceWithMetadata'
          description: Product instances for the enterprise
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Bad Request - Invalid enterprise ID
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Unauthorized - User is not admin of the enterprise
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Internal Server Error
      security:
        - EnterpriseAdminBearerAuth:
            - security:enterprise:admin:{enterprise_id}
      summary: Get Customer's Product Instance By Enterprise Id
      tags:
        - Enterprise
  /enterprise/region-hierarchy:
    get:
      description: API returns the regional hierarchy details of the enterprise
      operationId: GetEnterpriseRegionHierarchy
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.RegionalHierarchy'
          description: Regional hierarchy details
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Unauthorized - Invalid scope
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Forbidden - The request is understood, but it has been refused or access is not allowed
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Internal Server Error
      security:
        - EnterpriseAdminBearerAuth:
            - security:enterprise:admin:{enterprise_id}
      summary: Get Regional Hierarchy
      tags:
        - Enterprise
  /enterprise/{enterpriseId}/platform-subscription:
    post:
      description: Creates Customer Enterprise Record, Platform Bootstrap Subscription and provision Platform Bootstrap Products for given enterpriseId
      operationId: PostPlatformRoute
      parameters:
        - description: enterprise Id(uuid)
          in: path
          name: enterpriseId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/routes.PlatformBootstrapRequest'
        description: Platform Bootstrap Payload
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
          description: Success message
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Bad Request - Invalid request payload
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Unauthorized - Authentication credentials were missing or incorrect
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Internal Server Error
      security:
        - ServiceTokenBearerAuth:
            - security:provisioning:tenants:read
      summary: Creates Platform Bootstrap Subscription and provision Platform Bootstrap Products for given enterpriseId
      tags:
        - Enterprise
  /msp-claim-code/claim:
    post:
      description: Process MSP-specific claim code to provision subscriptions and product instances for managed service provider environments
      operationId: msp-claim-code-subscription
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/model.ClaimSubscription'
        description: MSP claim code subscription details for processing
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
          description: Successfully claimed and provisioned MSP product instances
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Bad request - validation errors, client-side errors, or invalid MSP configuration
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Unauthorized - token issues or admin permission denied
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Forbidden - rate limits, trials, or SKU restrictions for MSP
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Not found - MSP claim code or enterprise not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Conflict - MSP claim code already used or provisioning conflicts
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Internal server error - database or provisioning failure
      security:
        - EnterpriseAdminBearerAuth:
            - security:enterprise:admin:{enterprise_id}
      summary: MSP Claim Code for Subscription
      tags:
        - Claim Code
  /organizations/{managerId}/entitlements:
    get:
      description: Retrieves entitlements for a specific managed organization. User must be admin of the organization. Supports pagination and search.
      operationId: GetOrgEntitlements
      parameters:
        - description: Manager Organization ID (UUID)
          in: path
          name: managerId
          required: true
          schema:
            type: string
        - description: 'Number of records to return (default: 10)'
          in: query
          name: limit
          schema:
            type: integer
        - description: 'Number of records to skip (default: 0)'
          in: query
          name: offset
          schema:
            type: integer
        - description: Search term for filtering entitlements
          in: query
          name: search
          schema:
            type: string
        - description: Managed organization ID for filtering
          in: query
          name: managedOrgId
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.OrgEntitlements'
          description: Organization entitlements
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Bad request - Invalid parameters
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Unauthorized - User not admin of organization
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Internal server error
      security:
        - EnterpriseAdminBearerAuth:
            - security:enterprise:admin:{enterprise_id}
      summary: Get organization entitlements
      tags:
        - MSP Entitlements Management
  /organizations/{managerId}/managed/{managedId}/entitlements:
    get:
      description: List all active entitlements at the SKU level between a manager and managed organization
      operationId: get-managed-entitlements
      parameters:
        - description: Manager organization ID (UUID format)
          in: path
          name: managerId
          required: true
          schema:
            format: uuid
            type: string
        - description: Managed organization ID (UUID format)
          in: path
          name: managedId
          required: true
          schema:
            format: uuid
            type: string
        - description: Number of results per page (default 10)
          in: query
          name: limit
          schema:
            default: 10
            minimum: 1
            type: integer
        - description: Pagination offset (default 0)
          in: query
          name: offset
          schema:
            default: 0
            minimum: 0
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.OrgEntitlements'
          description: Successfully retrieved organization entitlements
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Bad request - invalid enterprise ID, limit, or offset value
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Unauthorized - user is not admin of the organization
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Forbidden - access to entitlements is not allowed
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Not found - manager or managed organization not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Internal server error
      security:
        - EnterpriseAdminBearerAuth:
            - security:enterprise:admin:{enterprise_id}
      summary: Get Entitlements for Managed Organization
      tags:
        - MSP Entitlements Management
    patch:
      description: Updates the quantity of entitlements shared from a manager organization to a managed organization
      operationId: update-managed-entitlements
      parameters:
        - description: Manager Organization ID (UUID)
          in: path
          name: managerId
          required: true
          schema:
            type: string
        - description: Managed Organization ID (UUID)
          in: path
          name: managedId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/model.UpdateEntitlementsRequest'
        description: Request body containing subscription and SKU details to update
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.UpdateEntitlementResponse'
          description: Successfully updated entitlements
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Invalid UUID format, request body, minimum quantity not met, or managed org not found
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: User is not an admin of manager or managed org
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Internal server error
      security:
        - EnterpriseAdminBearerAuth:
            - security:enterprise:admin:{enterprise_id}
      summary: Update entitlements between manager and managed organizations
      tags:
        - MSP Entitlements Management
  /productInstance/{instanceId}/applyLicenses:
    post:
      description: Applies licenses from a source product instance to a target product instance
      operationId: apply-product-instance-licenses
      parameters:
        - description: ID of the product instance to apply licenses to
          in: path
          name: instanceId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/model.ProductInstanceApplyLicensesRequest'
        description: Apply licenses request details
        required: true
      responses:
        '200':
          description: OK - Licenses applied successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Bad Request - Invalid instance ID, customer mismatch, or product mismatch
        '412':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Precondition Required - Customers do not match
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Internal Server Error - Error applying licenses
      security:
        - EnterpriseAdminBearerAuth:
            - security:enterprise:admin:{enterprise_id}
      summary: Apply licenses from a source product instance to a target product instance
      tags:
        - Product Instance
  /productInstance/{instanceId}/provision:
    post:
      description: Provisions a product instance with the given ID
      operationId: provision-product-instance
      parameters:
        - description: ID of the product instance to provision
          in: path
          name: instanceId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/model.ProductInstanceProvisionRequest'
        description: Provisioning request details
        required: true
      responses:
        '200':
          description: OK - Provisioning completed successfully
        '202':
          description: Accepted - Provisioning is in progress
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Bad Request - Invalid instance ID or request payload
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Unauthorized - User is not an admin of the associated enterprise
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Forbidden - Product is not provisionable via API
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Conflict - Product already exists for enterprise
        '424':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Failed Dependency - Error during provisioning
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Internal Server Error - Unexpected error during provisioning
      security:
        - EnterpriseAdminBearerAuth:
            - security:enterprise:admin:{enterprise_id}
      summary: Provision a product instance
      tags:
        - Product Instance
  /productInstanceInvitation:
    post:
      description: Creates a new legacy product invitation and sends email invitations to specified users
      operationId: create-product-instance-invitation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/model.LegacyProductInviteRequest'
        description: Legacy Product Invitation Request
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  invitationId:
                    type: string
                  productExternalTenantId:
                    type: string
                  region:
                    type: string
                  users:
                    items:
                      type: string
                    type: array
                type: object
          description: Successfully created invitation with invitation ID, region, product external tenant ID, and users
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Bad Request - Invalid request body, region not defined, users array empty, or invalid external tenant ID
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Unauthorized - Invalid scope
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Internal Server Error - Error creating legacy product invitation
      security:
        - ServiceTokenBearerAuth:
            - security:{product_id}:provisioning:tenants-attach
      summary: Create legacy product invitation
      tags:
        - Product Instance Invitation
  /productInstanceInvitation/{id}/accept:
    post:
      description: Accepts a legacy product invitation and associates it with the specified enterprise
      operationId: accept-product-instance-invitation
      parameters:
        - description: Invitation ID
          in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/model.AcceptLegacyProductInvitationRequest'
        description: Accept Invitation Request
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.LegacyProductInvite'
          description: Successfully accepted the invitation
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Bad Request - Not a valid UUID or invalid request body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Unauthorized - User is not an admin of the given enterprise
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Not Found - Invitation not found for the user
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Conflict - Invitation already associated to enterprise
        '412':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Precondition Failed - Invitation already accepted, not in pending state, or already associated to product instance
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Error'
          description: Internal Server Error - Error accepting legacy product invitation
      security:
        - ServiceTokenBearerAuth:
            - security:provisioning:subscriptions:write
      summary: Accept legacy product invitation
      tags:
        - Product Instance Invitation
